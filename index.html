<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI/IT 최신 소식</title>
<style>
  :root{ --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --ok:#3fb950; }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; line-height:1.7;
  }
  .card{
    max-width:520px; width:100%; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:36px 34px;
  }
  .ok{
    display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--ok);
    background:#3fb95015; border:1px solid #3fb95040; border-radius:999px;
    padding:5px 13px; margin-bottom:20px;
  }
  h1{ font-size:22px; margin:0 0 10px; letter-spacing:-.02em }
  p{ color:var(--dim); font-size:14.5px; margin:0 0 22px }
  ul{ margin:0; padding:0; list-style:none; border-top:1px solid var(--line) }
  li{ display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid #21262d; font-size:14px }
  li .n{ flex:none; width:20px; height:20px; border-radius:50%; background:#21262d;
         color:var(--dim); font-size:11px; display:flex; align-items:center; justify-content:center; margin-top:2px }
  li.done .n{ background:#3fb95020; color:var(--ok) }
  li.done span{ color:var(--dim) }
  footer{ margin-top:24px; font-size:12px; color:#6e7681 }
  code{ background:#21262d; padding:1px 6px; border-radius:4px; font-size:12.5px }
</style>
</head>
<body>
  <div class="card">
    <div class="ok">● 배포 성공</div>
    <h1>AI/IT 최신 소식</h1>
    <p>GitHub Pages가 정상 동작합니다. 이 페이지가 보인다면 배포 경로가 완성된 것입니다.</p>

    <ul>
      <li class="done"><span class="n">✓</span><span>저장소 생성</span></li>
      <li class="done"><span class="n">✓</span><span>파일 업로드</span></li>
      <li class="done"><span class="n">✓</span><span>Pages 활성화 — 지금 이 화면</span></li>
      <li><span class="n">4</span><span>RSS 수집기 만들기 <code>collect.py</code></span></li>
      <li><span class="n">5</span><span>목록 화면 만들기 <code>index.html</code></span></li>
      <li><span class="n">6</span><span>자동 실행 걸기 <code>collect.yml</code></span></li>
    </ul>

    <footer>이 파일은 확인용 임시 페이지입니다. 완성된 <code>index.html</code> 로 덮어쓰면 됩니다.</footer>
  </div>
</body>
</html>
