<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI/IT Radar — 한국·미국·일본 AI/IT 소식</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip" href="#articles-section">본문으로 건너뛰기</a>

<header class="site-header">
  <div class="bar">
    <h1>AI/IT&nbsp;Radar</h1>
    <span class="updated" id="updated">불러오는 중…</span>

    <div class="search">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 18 18"/></svg>
      <input type="search" id="search" placeholder="제목·출처 검색" autocomplete="off" aria-label="검색">
      <kbd class="search-kbd" id="search-kbd">/</kbd>
    </div>

    <button type="button" class="icon-btn" id="theme" title="화면 테마 전환" aria-label="화면 테마 전환">
      <span id="theme-icon">🌗</span>
    </button>
  </div>

  <div class="filters">
    <div class="chips" id="regions" role="group" aria-label="출처 국가">
      <button type="button" class="chip is-on" data-region="KR" aria-pressed="true"><span class="flag">🇰🇷</span>한국<span class="chip-num" data-count="KR"></span></button>
      <button type="button" class="chip is-on" data-region="US" aria-pressed="true"><span class="flag">🇺🇸</span>미국<span class="chip-num" data-count="US"></span></button>
      <button type="button" class="chip is-on" data-region="JP" aria-pressed="true"><span class="flag">🇯🇵</span>일본<span class="chip-num" data-count="JP"></span></button>
    </div>

    <span class="sep" aria-hidden="true"></span>

    <button type="button" class="chip chip-toggle" id="sources-toggle" aria-expanded="false" aria-controls="sources-panel">
      출처 <span class="chip-num" id="sources-num"></span>
      <span class="caret" aria-hidden="true">▾</span>
    </button>

    <button type="button" class="chip chip-toggle" id="range-toggle" aria-expanded="false" aria-controls="range-panel">
      기간 <span class="chip-num" id="range-label">전체</span>
      <span class="caret" aria-hidden="true">▾</span>
    </button>

    <div class="sort" role="group" aria-label="정렬">
      <button type="button" class="seg is-on" data-sort="mixed">골고루</button>
      <button type="button" class="seg" data-sort="recent">최신순</button>
    </div>

    <button type="button" class="link-btn" id="reset" hidden>필터 초기화</button>
  </div>

  <div class="sources-panel" id="sources-panel" hidden>
    <div class="panel-head">
      <span>출처 선택</span>
      <div>
        <button type="button" class="link-btn" data-sources="all">전체</button>
        <button type="button" class="link-btn" data-sources="none">해제</button>
      </div>
    </div>
    <div class="chips wrap" id="source-chips"></div>
  </div>

  <div class="range-panel" id="range-panel" hidden>
    <div class="panel-head">
      <span>기간 선택</span>
      <span class="range-span" id="range-span"></span>
    </div>

    <div class="chips wrap" id="range-presets">
      <button type="button" class="chip is-on" data-preset="all" aria-pressed="true">전체 <span class="chip-num"></span></button>
      <button type="button" class="chip" data-preset="today" aria-pressed="false">오늘 <span class="chip-num"></span></button>
      <button type="button" class="chip" data-preset="6h" aria-pressed="false">6시간 <span class="chip-num"></span></button>
      <button type="button" class="chip" data-preset="24h" aria-pressed="false">24시간 <span class="chip-num"></span></button>
      <button type="button" class="chip" data-preset="3d" aria-pressed="false">3일 <span class="chip-num"></span></button>
      <button type="button" class="chip" data-preset="7d" aria-pressed="false">7일 <span class="chip-num"></span></button>
    </div>

    <div class="range-fields">
      <label class="field">
        <span>시작</span>
        <input type="datetime-local" id="range-from" step="60">
      </label>
      <span class="tilde" aria-hidden="true">~</span>
      <label class="field">
        <span>종료</span>
        <input type="datetime-local" id="range-to" step="60">
      </label>
      <button type="button" class="apply-btn" id="range-apply">적용</button>
      <button type="button" class="link-btn" id="range-clear">지우기</button>
    </div>
  </div>
</header>

<main>
  <section class="block" id="videos-section" aria-labelledby="videos-h">
    <div class="block-head">
      <h2 id="videos-h">최신 영상</h2>
      <span class="count" id="videos-count"></span>
      <div class="rail-nav">
        <button type="button" class="icon-btn sm" id="rail-prev" aria-label="이전 영상">‹</button>
        <button type="button" class="icon-btn sm" id="rail-next" aria-label="다음 영상">›</button>
      </div>
    </div>
    <div class="video-rail" id="videos" tabindex="0" role="list" aria-label="최신 영상 목록"></div>
    <p class="empty" id="videos-empty" hidden>조건에 맞는 영상이 없습니다.</p>
  </section>

  <section class="block" id="articles-section" aria-labelledby="articles-h">
    <div class="block-head">
      <h2 id="articles-h">최신 기사</h2>
      <span class="count" id="articles-count" aria-live="polite"></span>
    </div>

    <div id="articles"></div>

    <p class="empty" id="articles-empty" hidden>
      조건에 맞는 기사가 없습니다.
      <button type="button" class="link-btn" data-reset>필터 초기화</button>
    </p>

    <div class="more-wrap">
      <button type="button" class="more-btn" id="more" hidden>더 보기</button>
      <div id="sentinel"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p id="source-summary" class="source-summary"></p>
  <ul class="source-status" id="source-status"></ul>
  <p class="hint">
    <code>scripts/collect.py</code> 가 만든 <code>public/data/feed.json</code> 하나만 읽습니다.
    단축키 <kbd>/</kbd> 검색 · <kbd>Esc</kbd> 검색 해제 · <kbd>g</kbd> 맨 위로
  </p>
</footer>

<button type="button" class="to-top" id="to-top" hidden aria-label="맨 위로">↑</button>

<script src="app.js"></script>
</body>
</html>
